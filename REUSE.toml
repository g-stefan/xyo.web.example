[[annotations]]
path = ".claude/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "fabricare/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "fabricare.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "version.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Unlicense"

[[annotations]]
path = "README.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "test/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2024-2026 Grigore Stefan <g_stefan@yahoo.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "source/**"
precedence = "closest"
